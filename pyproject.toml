[project]
name = "mrRNbNeuS2"
version = "1.1.0"
description = "Meshroom plugin for RNb-NeuS2 neural surface reconstruction from normal and reflectance maps."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MPL-2.0"}
authors = [{name = "Baptiste Brument"}]
dependencies = [
    "rnb-neus2",
]

# Meshroom discovers the node from MESHROOM_PLUGINS_PATH, not site-packages.
# uv only installs the plugin's dependencies into its venv.
[tool.uv]
package = false

[tool.uv.sources]
rnb-neus2 = { git = "https://github.com/meshroomHubWarehouse/RNb-NeuS2.git", tag = "v2.0.3" }

[tool.meshroom]
publisher = "meshroomHub"
requirements = "Nvidia GPU with a driver supporting CUDA 12. The RNb-NeuS2 testbed of the RNb-NeuS2 v2.0.3 release, installed with the plugin when the plugin manager supports release assets (see README)."
# Testbed of the RNb-NeuS2 release extracted into the plugin folder, relative to the plugin root.
# An environment variable of the same name overrides it.
env = [ { key = "RNB_NEUS2_TESTBED_PATH", type = "path", value = "RNb-NeuS2/build/testbed" } ]

# Archive of the current OS, extracted into the plugin folder. A plugin manager without release assets
# ignores this entry with a warning: the archive is then extracted by hand (see README).
[[tool.meshroom.assets]]
name = "testbed"
category = "binary"
release = "RobinBruneau/RNb-NeuS2@v2.0.3"
path = "RNb-NeuS2"
